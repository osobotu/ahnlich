name: Ahnlich MCP Release Smoke Test

on:
  push:
    branches: ["mcp-release-smoke"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  SMOKE_VERSION: 0.1.0.dev${{ github.run_id }}
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ahnlich-mcp
  IMAGE_TAG: smoke-${{ github.run_id }}

jobs:
  testpypi:
    name: Publish and install from TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.31"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "mcp/uv.lock"

      - name: Install project
        run: uv sync --locked --dev

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Set unique smoke version
        run: uv version "${SMOKE_VERSION}" --no-sync

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail

          WHEEL=$(find dist -maxdepth 1 -name "*.whl" -print -quit)
          test -n "${WHEEL}"

          uv run \
            --isolated \
            --no-project \
            --with "${WHEEL}" \
            -- ahnlich-mcp --help

      - name: Publish to TestPyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: >
          uv publish
          --publish-url https://test.pypi.org/legacy/
          --no-attestations
          dist/*

      - name: Install from TestPyPI
        shell: bash
        run: |
          set -euo pipefail

          TEST_ENV="${RUNNER_TEMP}/ahnlich-mcp-testpypi"
          python -m venv "${TEST_ENV}"

          INSTALLED=false

          for ATTEMPT in 1 2 3 4 5 6; do
            if "${TEST_ENV}/bin/pip" install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "ahnlich-mcp==${SMOKE_VERSION}"; then
              INSTALLED=true
              break
            fi

            if [[ "${ATTEMPT}" != "6" ]]; then
              sleep 10
            fi
          done

          test "${INSTALLED}" = "true"
          "${TEST_ENV}/bin/ahnlich-mcp" --help

  ghcr:
    name: Publish and run from personal GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85
        with:
          context: ./mcp
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=ahnlich-mcp-smoke
          cache-to: type=gha,mode=max,scope=ahnlich-mcp-smoke

      - name: Generate image attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Pull and run published image
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          docker run --rm "${IMAGE_NAME}:${IMAGE_TAG}" --help

          USER=$(docker image inspect \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format '{{.Config.User}}')

          test "${USER}" = "ahnlich"